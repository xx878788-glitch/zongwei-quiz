      A: "你的第一優先是把睡眠節奏穩定下來。比起偶爾睡很久，更重要的是固定上床、固定起床，並減少連續熬夜。",
      B: "壓力會讓人覺得自己一直在運轉。先替每天留一小段真正不用處理工作的時間，讓大腦有明確的下班訊號。",
      C: "久坐很容易讓整天都處在低活動量。從短時間走路、簡單阻力訓練開始，比突然逼自己做高強度運動更容易維持。",
      D: "外食與應酬多時，不用追求完美飲食。先顧蛋白質、蔬菜、水分與規律吃飯，再慢慢調整酒精和宵夜頻率。"
    };

    // 新測驗替換區：第三題 A、B、C、D 對應的個人化行動。
    const ACTIONS = {
      A: "接下來 7 天先固定一個上床時間，觀察下午掉電和早上起床的狀態有沒有變化。",
      B: "先安排每週 2～3 次、每次 20～30 分鐘的活動。重點是固定做到，不是一次練到沒力。",
      C: "從今天開始，把一餐調整得更完整，並把每日喝水量和應酬次數記下來，先找到最容易改善的地方。",
      D: "先把生活基本盤顧住，再閱讀男性保健品的成分與使用方式。若要補充瑪卡，也把它當成日常保養的一部分，而不是取代睡眠、運動或飲食。"
    };

    // 通用介面文字通常不需修改；如需換語言，可集中在此調整。
    const UI_TEXT = {
      heroSupporting: "三題完成，不到一分鐘",
      quizLabel: "柔柔男性日常狀態測驗",
      next: "下一題",
      previous: "回上一題",
      viewResult: "查看我的結果",
      calculating: "正在整理你的三個答案",
      resultKicker: "YOUR RESULT",
      analysisLabel: "你的目前狀態",
      detailLabel: "最該先處理的地方",
      actionLabel: "你可以先這樣做",
      restart: "重新測驗",
      unsetCta: "銷售頁連結待補"
    };

    /* ====================== 通用功能區：通常不需修改 ====================== */
    const ids = [
      "cover", "quiz-screen", "loading-screen", "result-screen", "category-label",
      "hero-title", "hero-subtitle", "hero-supporting", "intro-title", "intro-text",
      "start-button", "duration", "quiz-label", "question-count", "progress",
      "progress-fill", "question-number", "question-title", "question-hint", "options",
      "next-button", "back-button", "loading-text", "result-kicker", "result-title",
      "result-summary", "analysis-label", "result-analysis", "detail-label", "result-detail",
      "action-label", "result-action", "cta-title", "cta-description", "cta-button",
      "restart-button", "disclaimer"
    ];
    const element = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
    const answers = Array(QUESTIONS.length).fill(null);
    let currentQuestion = 0;

    function applyTheme() {
      const root = document.documentElement;
      root.style.setProperty("--background", THEME_CONFIG.backgroundColor);
      root.style.setProperty("--primary", THEME_CONFIG.primaryColor);
      root.style.setProperty("--accent", THEME_CONFIG.accentColor);
      root.style.setProperty("--text", THEME_CONFIG.textColor);
      root.style.setProperty("--card", THEME_CONFIG.cardColor);
      root.style.setProperty("--font", THEME_CONFIG.fontStyle);
      document.body.dataset.visualStyle = THEME_CONFIG.visualStyle;
    }

    function renderSite() {
      document.title = SITE_CONFIG.pageTitle;
      document.querySelector('meta[name="description"]').content = SITE_CONFIG.description;
      element["category-label"].textContent = SITE_CONFIG.categoryLabel;
      element["hero-title"].textContent = SITE_CONFIG.heroTitle;
      element["hero-subtitle"].textContent = SITE_CONFIG.heroSubtitle;
      element["hero-supporting"].textContent = UI_TEXT.heroSupporting;
      element["intro-title"].textContent = SITE_CONFIG.introTitle;
      element["intro-text"].textContent = SITE_CONFIG.introText;
      element["start-button"].textContent = SITE_CONFIG.startButtonText;
      element.duration.textContent = UI_TEXT.heroSupporting;
      element["quiz-label"].textContent = UI_TEXT.quizLabel;
      element["back-button"].textContent = UI_TEXT.previous;
      element["loading-text"].textContent = UI_TEXT.calculating;
      element["result-kicker"].textContent = UI_TEXT.resultKicker;
      element["analysis-label"].textContent = UI_TEXT.analysisLabel;
      element["detail-label"].textContent = UI_TEXT.detailLabel;
      element["action-label"].textContent = UI_TEXT.actionLabel;
      element["cta-title"].textContent = SITE_CONFIG.ctaTitle;
      element["cta-description"].textContent = SITE_CONFIG.ctaDescription;
      element["restart-button"].textContent = UI_TEXT.restart;
      element.disclaimer.textContent = SITE_CONFIG.disclaimer;
      renderCta();
    }

    function renderCta() {
      const url = SITE_CONFIG.ctaUrl.trim();
      if (!url) {
        element["cta-button"].textContent = UI_TEXT.unsetCta;
        element["cta-button"].removeAttribute("href");
        element["cta-button"].setAttribute("aria-disabled", "true");
        element["cta-button"].setAttribute("role", "button");
        return;
      }
      element["cta-button"].textContent = SITE_CONFIG.ctaButtonText;
      element["cta-button"].href = url;
      element["cta-button"].removeAttribute("aria-disabled");
      element["cta-button"].removeAttribute("role");
    }

    function showScreen(screen) {
      [element.cover, element["quiz-screen"], element["loading-screen"], element["result-screen"]]
        .forEach(item => { item.hidden = item !== screen; });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const question = QUESTIONS[currentQuestion];
      element["question-count"].textContent = `${currentQuestion + 1} / ${QUESTIONS.length}`;
      element.progress.setAttribute("aria-valuenow", String(currentQuestion + 1));
      element["progress-fill"].style.width = `${((currentQuestion + 1) / QUESTIONS.length) * 100}%`;
      element["question-number"].textContent = question.label;
      element["question-title"].textContent = question.title;
      element["question-hint"].textContent = question.hint;
      element.options.replaceChildren(...Object.entries(question.options).map(([letter, text]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `option${answers[currentQuestion] === letter ? " selected" : ""}`;
        button.setAttribute("aria-pressed", String(answers[currentQuestion] === letter));
        const badge = document.createElement("span");
        badge.className = "option-letter";
        badge.textContent = letter;
        const copy = document.createElement("span");
        copy.textContent = text;
        button.append(badge, copy);
        button.addEventListener("click", () => selectAnswer(letter));
        return button;
      }));
      element["next-button"].textContent = currentQuestion === QUESTIONS.length - 1 ? UI_TEXT.viewResult : UI_TEXT.next;
      element["next-button"].disabled = answers[currentQuestion] === null;
      element["back-button"].hidden = currentQuestion === 0;
    }

    function selectAnswer(letter) {
      answers[currentQuestion] = letter;
      renderQuestion();
    }

    function renderResult() {
      const result = RESULTS[answers[0]];
      element["result-title"].textContent = result.title;
      element["result-summary"].textContent = result.summary;
      element["result-analysis"].textContent = result.analysis;
      element["result-detail"].textContent = DETAILS[answers[1]];
      element["result-action"].textContent = ACTIONS[answers[2]];
      showScreen(element["result-screen"]);
    }

    function nextQuestion() {
      if (answers[currentQuestion] === null) return;
      if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion += 1;
        renderQuestion();
        showScreen(element["quiz-screen"]);
        return;
      }
      showScreen(element["loading-screen"]);
      window.setTimeout(renderResult, 1000);
    }

    function previousQuestion() {
      if (currentQuestion === 0) return;
      currentQuestion -= 1;
      renderQuestion();
      showScreen(element["quiz-screen"]);
    }

    function restartQuiz() {
      answers.fill(null);
      currentQuestion = 0;
      renderQuestion();
      showScreen(element.cover);
    }

    element["start-button"].addEventListener("click", () => {
      currentQuestion = 0;
      renderQuestion();
      showScreen(element["quiz-screen"]);
    });
    element["next-button"].addEventListener("click", nextQuestion);
    element["back-button"].addEventListener("click", previousQuestion);
    element["restart-button"].addEventListener("click", restartQuiz);
    element["cta-button"].addEventListener("click", event => {
      if (!SITE_CONFIG.ctaUrl.trim()) event.preventDefault();
    });

    applyTheme();
    renderSite();
    renderQuestion();
  </script>
</body>
</html>
