<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="三題測驗，看看你最近最需要注意的是財運、人際、事業還是自身能量。">
  <title>你最近的不順來自哪裡｜雲林宗瑋互動測驗</title>
  <style>
    :root {
      --ink: #151311;
      --ink-soft: #211b18;
      --paper: #e8dcc4;
      --paper-light: #f3ead7;
      --red: #672d2d;
      --red-deep: #401c1c;
      --gold: #b9a06a;
      --gold-soft: #d0bc8d;
      --shadow-offset: 7px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    html,
    body {
      background: var(--ink);
    }

    body {
      margin: 0;
      color: var(--paper);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(103, 45, 45, 0.22), transparent 34%),
        radial-gradient(circle at 86% 82%, rgba(103, 45, 45, 0.14), transparent 32%),
        linear-gradient(rgba(232, 220, 196, 0.018) 1px, transparent 1px),
        var(--ink-soft);
      background-size: auto, auto, 100% 31px, auto;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 13px;
      z-index: -1;
      border: 1px solid rgba(185, 160, 106, 0.22);
      border-radius: 18px;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      z-index: -1;
      border-radius: 58% 42% 49% 51% / 45% 56% 44% 55%;
      background:
        radial-gradient(circle at 35% 40%, rgba(185, 160, 106, 0.15), transparent 43%),
        radial-gradient(circle at 68% 60%, rgba(103, 45, 45, 0.22), transparent 55%);
      filter: blur(28px);
      animation: aura-flow 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .blob-one {
      top: -90px;
      right: -105px;
      width: 290px;
      height: 290px;
    }

    .blob-two {
      bottom: -105px;
      left: -125px;
      width: 330px;
      height: 330px;
      opacity: 0.72;
      animation-delay: -7s;
      animation-duration: 19s;
    }

    .hero {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(48px, 8vh, 76px) 24px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .eyebrow {
      align-self: center;
      margin: 0 0 26px;
      padding: 7px 14px;
      border: 1.5px solid rgba(185, 160, 106, 0.72);
      border-radius: 999px;
      background: rgba(64, 28, 28, 0.72);
      color: var(--paper-light);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    h1 {
      margin: 0;
      color: var(--paper-light);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: clamp(2.25rem, 10vw, 4rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.035em;
      text-wrap: balance;
      text-shadow: 0 3px 20px rgba(0, 0, 0, 0.4);
    }

    .highlight {
      display: inline;
      padding: 0 0.12em 0.03em;
      color: #181411;
      background: linear-gradient(transparent 10%, var(--gold) 10% 91%, transparent 91%);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      text-shadow: none;
    }

    .possibilities {
      margin: 24px 0 0;
      color: var(--gold-soft);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: clamp(1.05rem, 4.8vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    .hint {
      margin: 12px 0 30px;
      color: #c6b99f;
      font-size: 0.96rem;
      line-height: 1.7;
    }

    .intro-card {
      position: relative;
      width: 100%;
      margin: 0 auto 30px;
      padding: 22px 24px;
      border: 2px solid var(--gold);
      border-radius: 18px;
      background: rgba(232, 220, 196, 0.95);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--red-deep);
      color: #322922;
      text-align: left;
    }

    .intro-card::before {
      content: "“";
      position: absolute;
      top: 7px;
      right: 18px;
      color: rgba(103, 45, 45, 0.28);
      font-family: Georgia, serif;
      font-size: 4.2rem;
      font-weight: 700;
      line-height: 1;
    }

    .intro-card strong {
      display: block;
      margin-bottom: 8px;
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: 1.3rem;
      letter-spacing: 0.04em;
    }

    .intro-card p {
      margin: 0;
      color: #493c33;
      font-size: 1rem;
      line-height: 1.8;
    }

    .start-button {
      width: 100%;
      min-height: 58px;
      padding: 14px 24px;
      border: 2px solid var(--gold-soft);
      border-radius: 16px;
      background: var(--red);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 #0a0908;
      color: var(--paper-light);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      cursor: pointer;
    }

    .duration {
      margin: 18px 0 0;
      color: #bcae94;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    [hidden] {
      display: none !important;
    }

    .quiz-screen {
      width: min(100%, 580px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 36px 24px 46px;
    }

    .quiz-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--gold-soft);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .quiz-topline p {
      margin: 0;
    }

    .question-count {
      flex: 0 0 auto;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      margin: 15px 0 42px;
      overflow: hidden;
      border: 1px solid rgba(185, 160, 106, 0.52);
      border-radius: 999px;
      background: rgba(10, 9, 8, 0.58);
    }

    .progress-fill {
      width: 33.333%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--gold));
      transition: width 320ms ease;
    }

    .question-number {
      margin: 0 0 13px;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .question-title {
      margin: 0;
      color: var(--paper-light);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: clamp(1.9rem, 8vw, 3rem);
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: 0.035em;
      text-wrap: balance;
    }

    .question-hint {
      margin: 14px 0 28px;
      color: #bcae94;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .answers {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .answer-card {
      position: relative;
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 15px 17px;
      border: 1.5px solid rgba(185, 160, 106, 0.72);
      border-radius: 15px;
      background: rgba(33, 27, 24, 0.88);
      box-shadow: 4px 4px 0 rgba(10, 9, 8, 0.85);
      color: var(--paper);
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .answer-card input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .answer-letter {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    .answer-text {
      min-width: 0;
      font-size: 1rem;
      line-height: 1.55;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .answer-card:has(input:checked) {
      border-color: var(--gold-soft);
      background: var(--red-deep);
      transform: translate(-2px, -2px);
    }

    .answer-card:has(input:checked) .answer-letter {
      background: var(--gold);
      color: var(--ink);
    }

    .answer-card:focus-within {
      outline: 3px solid rgba(208, 188, 141, 0.34);
      outline-offset: 3px;
    }

    .next-button {
      width: 100%;
      min-height: 58px;
      margin-top: 28px;
      padding: 14px 24px;
      border: 2px solid var(--gold-soft);
      border-radius: 16px;
      background: var(--red);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 #0a0908;
      color: var(--paper-light);
      font: inherit;
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: opacity 180ms ease;
    }

    .next-button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .nav-actions {
      display: grid;
      gap: 17px;
      margin-top: 28px;
    }

    .nav-actions .next-button {
      margin-top: 0;
    }

    .back-button {
      justify-self: center;
      padding: 5px 9px;
      border: 0;
      border-bottom: 1px solid rgba(208, 188, 141, 0.52);
      background: transparent;
      color: #c6b99f;
      font: inherit;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .calculation-screen {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 44px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .spinner {
      position: relative;
      width: 92px;
      height: 92px;
      margin-bottom: 30px;
      border: 2px solid rgba(185, 160, 106, 0.2);
      border-top-color: var(--gold-soft);
      border-right-color: var(--red);
      border-radius: 50%;
      box-shadow: 0 0 32px rgba(103, 45, 45, 0.28);
      animation: spin 1.1s linear infinite;
    }

    .spinner::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(208, 188, 141, 0.42);
      border-radius: 50%;
    }

    .calculation-text {
      margin: 0;
      color: var(--paper-light);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.07em;
    }

    .result-screen {
      width: min(100%, 580px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 38px 24px 46px;
    }

    .result-kicker {
      margin: 0 0 12px;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-align: center;
    }

    .result-type {
      width: fit-content;
      margin: 0 auto 18px;
      padding: 7px 15px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      background: rgba(64, 28, 28, 0.72);
      color: var(--gold-soft);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .result-title {
      margin: 0 0 18px;
      color: var(--paper-light);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: clamp(2rem, 8.8vw, 3.3rem);
      line-height: 1.35;
      letter-spacing: 0.035em;
      text-align: center;
      text-wrap: balance;
    }

    .result-summary {
      margin: 0 auto 30px;
      color: var(--gold-soft);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.75;
      text-align: center;
    }

    .result-card {
      margin-bottom: 18px;
      padding: 21px 20px;
      border: 1.5px solid rgba(185, 160, 106, 0.74);
      border-radius: 16px;
      background: rgba(33, 27, 24, 0.9);
      box-shadow: 5px 5px 0 rgba(10, 9, 8, 0.82);
    }

    .result-card h3 {
      margin: 0 0 10px;
      color: var(--gold-soft);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: 1.12rem;
      letter-spacing: 0.06em;
    }

    .result-card p {
      margin: 0;
      color: var(--paper);
      font-size: 1rem;
      line-height: 1.78;
    }

    .result-card.reminder {
      border-color: rgba(103, 45, 45, 0.88);
      background: rgba(64, 28, 28, 0.7);
    }

    .result-card.reminder h3 {
      color: #c88d7d;
    }

    .personalized-grid {
      display: grid;
      gap: 18px;
      margin: 28px 0;
    }

    .personalized-card {
      padding: 21px 20px;
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      background: rgba(232, 220, 196, 0.95);
      box-shadow: 5px 5px 0 var(--red-deep);
      color: #332922;
    }

    .personalized-card h3 {
      margin: 0 0 10px;
      color: var(--red-deep);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: 1.08rem;
      line-height: 1.5;
    }

    .personalized-card p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.75;
    }

    .line-cta {
      margin-top: 32px;
      padding: 26px 21px;
      border: 2px solid var(--gold-soft);
      border-radius: 18px;
      background: linear-gradient(145deg, #5c2929, #381919);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 #0a0908;
      text-align: center;
    }

    .line-cta h3 {
      margin: 0 0 10px;
      color: var(--paper-light);
      font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif;
      font-size: 1.35rem;
      line-height: 1.45;
    }

    .line-cta p {
      margin: 0 0 19px;
      color: #d8ccb4;
      font-size: 0.96rem;
      line-height: 1.65;
    }

    .line-button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #183c28;
      border-radius: 13px;
      background: #3f7855;
      box-shadow: 5px 5px 0 #122a1d;
      color: #fffdf7;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.45;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .restart-button {
      display: block;
      margin: 30px auto 0;
      padding: 7px 10px;
      border: 0;
      border-bottom: 1px solid rgba(208, 188, 141, 0.54);
      background: transparent;
      color: var(--gold-soft);
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .disclaimer {
      margin: 30px 0 0;
      color: #8f8370;
      font-size: 0.78rem;
      line-height: 1.65;
      text-align: center;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes aura-flow {
      0% {
        border-radius: 58% 42% 49% 51% / 45% 56% 44% 55%;
        transform: translate3d(-8px, 5px, 0) rotate(0deg) scale(0.92);
      }
      50% {
        border-radius: 42% 58% 63% 37% / 58% 39% 61% 42%;
        transform: translate3d(15px, -12px, 0) rotate(8deg) scale(1.08);
      }
      100% {
        border-radius: 61% 39% 43% 57% / 38% 62% 38% 62%;
        transform: translate3d(-4px, 14px, 0) rotate(-6deg) scale(0.98);
      }
    }

    @media (min-width: 681px) {
      body {
        padding: 28px 0;
      }

      .page {
        min-height: calc(100vh - 56px);
        border: 1px solid rgba(185, 160, 106, 0.28);
        border-radius: 28px;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.52);
      }

      .hero {
        min-height: calc(100vh - 56px);
      }

      .quiz-screen {
        min-height: calc(100vh - 56px);
      }
    }

    @media (max-height: 760px) {
      .hero {
        justify-content: flex-start;
        padding-top: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob {
        animation: none;
      }

      .spinner {
        animation-duration: 2.4s;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="blob blob-one" aria-hidden="true"></div>
    <div class="blob blob-two" aria-hidden="true"></div>

    <section class="hero" id="cover" aria-labelledby="quiz-title">
      <p class="eyebrow" id="cover-eyebrow"></p>

      <h1 id="quiz-title"></h1>

      <p class="possibilities" id="cover-possibilities"></p>
      <p class="hint" id="cover-hint"></p>

      <article class="intro-card">
        <strong id="intro-name"></strong>
        <p id="intro-copy"></p>
      </article>

      <button class="start-button" id="start-quiz" type="button"></button>
      <p class="duration" id="cover-duration"></p>
    </section>

    <section class="quiz-screen" id="quiz-screen" aria-labelledby="question-title" hidden>
      <header>
        <div class="quiz-topline">
          <p id="quiz-label"></p>
          <p class="question-count" id="question-count" aria-live="polite"></p>
        </div>
        <div class="progress-track" id="progress-track" role="progressbar" aria-label="測驗進度" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </header>

      <p class="question-number" id="question-number"></p>
      <h2 class="question-title" id="question-title"></h2>
      <p class="question-hint" id="question-hint"></p>

      <fieldset class="answers" id="answers" aria-label="題目答案"></fieldset>

      <div class="nav-actions">
        <button class="next-button" id="next-question" type="button" disabled></button>
        <button class="back-button" id="previous-question" type="button" hidden></button>
      </div>
    </section>

    <section class="calculation-screen" id="calculation-screen" aria-live="polite" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="calculation-text" id="calculation-text"></p>
    </section>

    <section class="result-screen" id="result-screen" aria-labelledby="result-title" hidden>
      <p class="result-kicker" id="result-kicker"></p>
      <p class="result-type" id="result-type"></p>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-summary" id="result-summary"></p>

      <article class="result-card">
        <h3 id="analysis-label"></h3>
        <p id="result-analysis"></p>
      </article>

      <article class="result-card reminder">
        <h3 id="reminder-label"></h3>
        <p id="result-reminder"></p>
      </article>

      <div class="personalized-grid">
        <article class="personalized-card">
          <h3 id="drain-label"></h3>
          <p id="result-drain"></p>
        </article>

        <article class="personalized-card">
          <h3 id="action-label"></h3>
          <p id="result-action"></p>
        </article>
      </div>

      <aside class="line-cta">
        <h3 id="line-title"></h3>
        <p id="line-description"></p>
        <a class="line-button" id="line-button" href="#"></a>
      </aside>

      <button class="restart-button" id="restart-quiz" type="button"></button>
      <p class="disclaimer" id="disclaimer"></p>
    </section>
  </main>

  <script>
    // ===== 母版內容設定：建立新測驗時，優先修改以下資料物件 =====
    const SITE_CONFIG = {
      siteName: "雲林宗瑋互動測驗",
      pageTitle: "你最近的不順來自哪裡｜雲林宗瑋互動測驗",
      personaName: "雲林宗瑋",
      lineButtonText: "加入LINE領取完整解析",
      lineUrl: "",
      metaDescription: "三題測驗，看看你最近最需要注意的是財運、人際、事業還是自身能量。",
      introGreeting: "Hi 我是{name}",
      lineDescription: "加入{name}LINE，領取更完整的個人解析",
      cover: {
        eyebrow: "玄學世界 · 自我探索",
        titleBefore: "你最近",
        titleHighlight: "一直不順",
        titleAfter: ["可能是哪一種能量", "正在影響你"],
        possibilities: "財運、人際、事業、情緒",
        hint: "三題，看你最近究竟卡在哪裡",
        introLines: ["從親身經歷、宮廟文化到民間玄學", "跟你分享圈內真正會遇到的事情"],
        startButtonText: "開始測驗",
        duration: "只要三題，不到一分鐘"
      },
      labels: {
        quizName: "最近不順的原因 · 測驗",
        next: "下一題",
        result: "看我的結果",
        previous: "回上一題",
        calculating: "正在對照你的三個答案",
        analysis: "狀態解析",
        reminder: "給你的提醒",
        drain: "最近最消耗你的原因",
        action: "這星期可以先做的事情",
        lineTitle: "想知道最近該怎麼調整？",
        resultKicker: "YOUR RESULT",
        questionPrefix: "QUESTION",
        restart: "重新測一次",
        disclaimer: "本測驗僅供娛樂與自我探索，不代表任何專業診斷。",
        lineNotReady: "LINE連結尚未設定"
      }
    };

    const cover = document.getElementById("cover");
    const quizScreen = document.getElementById("quiz-screen");
    const calculationScreen = document.getElementById("calculation-screen");
    const resultScreen = document.getElementById("result-screen");
    const startButton = document.getElementById("start-quiz");
    const nextButton = document.getElementById("next-question");
    const previousButton = document.getElementById("previous-question");
    const questionCount = document.getElementById("question-count");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const questionNumber = document.getElementById("question-number");
    const questionTitle = document.getElementById("question-title");
    const questionHint = document.getElementById("question-hint");
    const answersContainer = document.getElementById("answers");
    const resultType = document.getElementById("result-type");
    const resultTitle = document.getElementById("result-title");
    const resultSummary = document.getElementById("result-summary");
    const resultAnalysis = document.getElementById("result-analysis");
    const resultReminder = document.getElementById("result-reminder");
    const resultDrain = document.getElementById("result-drain");
    const resultAction = document.getElementById("result-action");
    const restartButton = document.getElementById("restart-quiz");
    const coverEyebrow = document.getElementById("cover-eyebrow");
    const coverTitle = document.getElementById("quiz-title");
    const coverPossibilities = document.getElementById("cover-possibilities");
    const coverHint = document.getElementById("cover-hint");
    const introName = document.getElementById("intro-name");
    const introCopy = document.getElementById("intro-copy");
    const coverDuration = document.getElementById("cover-duration");
    const quizLabel = document.getElementById("quiz-label");
    const calculationText = document.getElementById("calculation-text");
    const analysisLabel = document.getElementById("analysis-label");
    const reminderLabel = document.getElementById("reminder-label");
    const drainLabel = document.getElementById("drain-label");
    const actionLabel = document.getElementById("action-label");
    const lineTitle = document.getElementById("line-title");
    const lineDescription = document.getElementById("line-description");
    const lineButton = document.getElementById("line-button");
    const disclaimer = document.getElementById("disclaimer");
    const resultKicker = document.getElementById("result-kicker");

    const QUESTIONS = [
      {
        title: ["最近哪一種狀況", "最讓你感覺不太對勁？"],
        hint: "不要想太久，選擇最近最有感的一個。",
        options: [
          "明明有收入，錢卻總是莫名留不住",
          "跟人相處時，常常感覺自己一直被消耗",
          "工作和計畫一直卡關，機會來了也接不住",
          "最近容易疲累、睡不好，心裡經常感到不安"
        ]
      },
      {
        title: ["最近最消耗你的", "是哪一種事情？"],
        hint: "選擇一個最符合你目前狀態的答案。",
        options: [
          "對別人付出很多，最後卻被當成理所當然",
          "看見別人過得很好，開始懷疑是不是自己不夠努力",
          "心裡有很多話，但覺得說了也沒有用，只能自己忍著",
          "沒有發生什麼大事，但最近總是提不起精神，做什麼都覺得不太順"
        ]
      },
      {
        title: ["現在的你", "最想先改變哪件事？"],
        hint: "選擇這星期最想開始做的事情。",
        options: [
          "練習拒絕別人，不再什麼事情都自己承擔",
          "遠離一直消耗自己的人，把力氣留給值得的人",
          "停止和別人比較，先把自己的生活慢慢整理好",
          "先調整作息和生活環境，讓自己的狀態慢慢恢復穩定"
        ]
      }
    ];

    const RESULTS = {
      A: {
          type: "財運流失型",
          title: ["你現在最需要注意的是", "財運正在慢慢流失"],
          summary: "不是完全賺不到，而是錢來了之後總有事情讓它留不住。",
          analysis: "最近的你可能一直有突發支出，或者明明很努力，最後留下來的成果卻不如預期。這不一定代表你沒有財運，而是目前的生活節奏和判斷容易讓財氣分散。",
          reminder: "先不要急著追求突然翻身，能把已經擁有的守住，才是財運開始穩定的第一步。"
      },
      B: {
          type: "人際消耗型",
          title: ["你現在最需要注意的是", "身邊有人正在消耗你"],
          summary: "你不是不夠善良，而是把太多力氣留給了不懂珍惜的人。",
          analysis: "最近的你可能經常替別人著想，遇到不舒服的事情也習慣先忍下來。時間久了，別人容易把你的付出當成理所當然，你也會慢慢感覺自己被掏空。",
          reminder: "真正值得留下的關係，不會只靠你一個人一直付出。"
      },
      C: {
          type: "事業卡關型",
          title: ["你現在最需要注意的是", "機會來了卻總是接不住"],
          summary: "你不是沒有能力，只是目前的方向和行動還沒有對上。",
          analysis: "最近的你可能很想改變現況，也看見了一些機會，但每到真正要決定時就容易猶豫，或者被其他事情打亂。久了會覺得自己一直停在原地。",
          reminder: "不用一次把所有事情做到完美，先選定一個方向持續行動，運勢才有機會跟著轉動。"
      },
      D: {
          type: "能量低落型",
          title: ["你現在最需要注意的是", "自己的能量已經消耗太久"],
          summary: "最近的不順不一定都來自外面，也可能是你已經累到沒有力氣保護自己。",
          analysis: "最近的你可能容易疲累、心煩、睡不好，對很多事情提不起精神。當一個人長期處於緊繃狀態，判斷、人際和工作都容易跟著受到影響。",
          reminder: "現在最重要的不是逼自己撐下去，而是先把生活和情緒慢慢穩定下來。"
      }
    };

    const DRAINS = {
      A: "你把善良和時間留給別人，但對方可能已經把你的付出當成理所當然。",
      B: "你看見別人表現出來的生活，開始懷疑自己是不是過得不夠好。",
      C: "你心裡累積了很多感受，卻一直覺得說了也沒有用，只能自己消化。",
      D: "你可能已經累了一段時間，只是一直沒有真正停下來休息。當精神和情緒長期處於消耗狀態，很多原本簡單的事情也會開始覺得不順。"
    };

    const ACTIONS = {
      A: "這星期練習說一次「不要」，不用每件事情都勉強自己答應。",
      B: "暫時遠離一段讓你不舒服的關係，把注意力留給真正重視你的人。",
      C: "每天安排一段時間放下手機，不再用別人整理過的生活比較自己。",
      D: "這星期先挑一天早點休息，順手整理房間或工作空間，把讓自己煩躁的東西慢慢清掉。"
    };

    const selectedAnswers = Array(QUESTIONS.length).fill(null);
    let currentQuestion = 0;

    function renderSiteContent() {
      document.title = SITE_CONFIG.pageTitle;
      document.querySelector('meta[name="description"]').content = SITE_CONFIG.metaDescription;
      coverEyebrow.textContent = SITE_CONFIG.cover.eyebrow;
      coverTitle.innerHTML = `${SITE_CONFIG.cover.titleBefore}<span class="highlight">${SITE_CONFIG.cover.titleHighlight}</span><br>${SITE_CONFIG.cover.titleAfter.join("<br>")}`;
      coverPossibilities.textContent = SITE_CONFIG.cover.possibilities;
      coverHint.textContent = SITE_CONFIG.cover.hint;
      introName.textContent = SITE_CONFIG.introGreeting.replace("{name}", SITE_CONFIG.personaName);
      introCopy.innerHTML = SITE_CONFIG.cover.introLines.join("<br>");
      startButton.textContent = SITE_CONFIG.cover.startButtonText;
      coverDuration.textContent = SITE_CONFIG.cover.duration;
      quizLabel.textContent = SITE_CONFIG.labels.quizName;
      previousButton.textContent = SITE_CONFIG.labels.previous;
      calculationText.textContent = SITE_CONFIG.labels.calculating;
      resultKicker.textContent = SITE_CONFIG.labels.resultKicker;
      analysisLabel.textContent = SITE_CONFIG.labels.analysis;
      reminderLabel.textContent = SITE_CONFIG.labels.reminder;
      drainLabel.textContent = SITE_CONFIG.labels.drain;
      actionLabel.textContent = SITE_CONFIG.labels.action;
      lineTitle.textContent = SITE_CONFIG.labels.lineTitle;
      lineDescription.textContent = SITE_CONFIG.lineDescription.replace("{name}", SITE_CONFIG.personaName);
      lineButton.textContent = SITE_CONFIG.lineButtonText;
      lineButton.href = SITE_CONFIG.lineUrl || "#";
      restartButton.textContent = SITE_CONFIG.labels.restart;
      disclaimer.textContent = SITE_CONFIG.labels.disclaimer;
    }

    function renderQuestion() {
      const question = QUESTIONS[currentQuestion];
      const displayNumber = String(currentQuestion + 1).padStart(2, "0");

      questionCount.textContent = `${currentQuestion + 1} / ${QUESTIONS.length}`;
      questionCount.setAttribute("aria-label", `第 ${currentQuestion + 1} 題，共 ${QUESTIONS.length} 題`);
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion + 1));
      progressFill.style.width = `${((currentQuestion + 1) / QUESTIONS.length) * 100}%`;
      questionNumber.textContent = `${SITE_CONFIG.labels.questionPrefix} ${displayNumber}`;
      questionTitle.innerHTML = question.title.join("<br>");
      questionHint.textContent = question.hint;
      nextButton.textContent = currentQuestion === QUESTIONS.length - 1 ? SITE_CONFIG.labels.result : SITE_CONFIG.labels.next;
      nextButton.disabled = selectedAnswers[currentQuestion] === null;
      previousButton.hidden = currentQuestion === 0;

      answersContainer.innerHTML = question.options.map((option, index) => {
        const letter = String.fromCharCode(65 + index);
        const checked = selectedAnswers[currentQuestion] === letter ? " checked" : "";
        return `
          <label class="answer-card">
            <input type="radio" name="current-answer" value="${letter}"${checked}>
            <span class="answer-letter">${letter}</span>
            <span class="answer-text">${option}</span>
          </label>
        `;
      }).join("");
    }

    function goToTop() {
      window.scrollTo(0, 0);
    }

    function getResultData(answerSet) {
      const primaryResult = RESULTS[answerSet[0]];

      return {
        ...primaryResult,
        drainReason: DRAINS[answerSet[1]],
        weeklyAction: ACTIONS[answerSet[2]]
      };
    }

    function renderResult() {
      const result = getResultData(selectedAnswers);

      resultType.textContent = result.type;
      resultTitle.innerHTML = result.title.join("<br>");
      resultSummary.textContent = result.summary;
      resultAnalysis.textContent = result.analysis;
      resultReminder.textContent = result.reminder;
      resultDrain.textContent = result.drainReason;
      resultAction.textContent = result.weeklyAction;
    }

    renderSiteContent();
    renderQuestion();

    startButton.addEventListener("click", () => {
      cover.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
      goToTop();
    });

    answersContainer.addEventListener("change", (event) => {
      if (event.target.matches('input[name="current-answer"]')) {
        selectedAnswers[currentQuestion] = event.target.value;
        nextButton.disabled = false;
      }
    });

    lineButton.addEventListener("click", (event) => {
      if (!SITE_CONFIG.lineUrl) {
        event.preventDefault();
        window.alert(SITE_CONFIG.labels.lineNotReady);
      }
    });

    nextButton.addEventListener("click", () => {
      if (selectedAnswers[currentQuestion] === null) return;

      if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion += 1;
        renderQuestion();
        goToTop();
        return;
      }

      quizScreen.hidden = true;
      calculationScreen.hidden = false;
      goToTop();

      window.setTimeout(() => {
        calculationScreen.hidden = true;
        renderResult();
        resultScreen.hidden = false;
        goToTop();
      }, 1000);
    });

    previousButton.addEventListener("click", () => {
      if (currentQuestion === 0) return;
      currentQuestion -= 1;
      renderQuestion();
      goToTop();
    });

    restartButton.addEventListener("click", () => {
      selectedAnswers.fill(null);
      currentQuestion = 0;
      resultScreen.hidden = true;
      calculationScreen.hidden = true;
      quizScreen.hidden = true;
      cover.hidden = false;
      renderQuestion();
      goToTop();
    });
  </script>
</body>
</html>
