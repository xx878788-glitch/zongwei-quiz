<!doctype html>

  <style>
    :root {

      --card: #fffaf2;
      --muted: #775f53;
      --shadow: #d5bda8;
      --font: "Microsoft JhengHei", "PingFang TC", sans-serif;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background: var(--background);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.7;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: min(72vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(20px);
      opacity: .2;
      pointer-events: none;
      animation: float 14s ease-in-out infinite alternate;
    }

    body::before { top: -28vw; left: -24vw; background: var(--primary); }
    body::after { right: -25vw; bottom: -30vw; background: var(--accent); animation-delay: -6s; }

    button, a { font: inherit; }
    button { color: inherit; }
    .page { width: min(100%, 680px); min-height: 100vh; margin: 0 auto; padding: clamp(24px, 7vw, 52px) 18px 48px; }
    .screen[hidden] { display: none; }
    .screen { animation: enter .4s ease both; }
    .cover { padding-top: clamp(24px, 8vh, 80px); }

    .label {
      display: inline-flex;
      padding: 5px 13px;
      border: 1px solid color-mix(in srgb, var(--accent) 64%, transparent);
      border-radius: 999px;
      color: var(--accent);
      background: color-mix(in srgb, var(--background) 75%, transparent);
      font-size: .85rem;
      letter-spacing: .12em;
    }

    h1, h2, h3 { margin: 0; line-height: 1.3; }
    h1 { max-width: 620px; margin: 24px 0 15px; font-size: clamp(2.15rem, 9vw, 4rem); letter-spacing: .025em; }
    .subtitle { margin: 0 0 8px; color: var(--accent); font-size: 1.05rem; font-weight: 700; }
    .supporting { margin: 0 0 26px; color: var(--muted); }

    .card {
      margin: 24px 5px 30px;
      padding: 22px;
      border: 1px solid color-mix(in srgb, var(--accent) 58%, transparent);
      border-radius: 18px;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      box-shadow: 7px 7px 0 var(--shadow);
    }

    .card strong { color: var(--accent); font-size: 1.25rem; }
    .card p { margin: 7px 0 0; }
    .primary, .cta-link {
      display: block;
      width: calc(100% - 10px);
      margin-left: 5px;
      padding: 15px 18px;
      border: 1px solid var(--accent);
      border-radius: 13px;
      color: var(--text);
      background: var(--primary);
      box-shadow: 6px 6px 0 var(--shadow);
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;

    .primary:hover, .cta-link:hover { transform: translate(2px, 2px); box-shadow: 4px 4px 0 var(--shadow); }

    .duration { margin: 13px 0 0; color: var(--muted); text-align: center; font-size: .875rem; }

    .quiz-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--accent); font-size: .875rem; letter-spacing: .08em; }
    .progress { height: 8px; margin: 13px 0 34px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--card) 75%, transparent); }
    .progress-fill { width: 33.333%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .32s ease; }
    .question-number { margin: 0 0 10px; color: var(--accent); font-size: .85rem; font-weight: 700; letter-spacing: .17em; }
    .question-title { font-size: clamp(1.7rem, 7vw, 2.6rem); }
    .question-hint { margin: 10px 0 23px; color: var(--muted); }
    .options { display: grid; gap: 13px; margin: 0; padding: 0; border: 0; }

    .option {
      display: flex;
      width: 100%;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      overflow-wrap: anywhere;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-radius: 14px;
      color: var(--text);
      background: color-mix(in srgb, var(--card) 91%, transparent);
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .option:hover { border-color: var(--accent); transform: translateY(-1px); }
    .option.selected { border-color: var(--accent); background: color-mix(in srgb, var(--primary) 72%, var(--card)); }
    .option-letter { display: grid; flex: 0 0 32px; height: 32px; place-items: center; border: 1px solid var(--accent); border-radius: 50%; color: var(--accent); font-weight: 800; }
    .option.selected .option-letter { color: var(--background); background: var(--accent); }
    .controls { margin-top: 26px; }
    .back, .restart { display: block; margin: 20px auto 0; padding: 9px 18px; border: 1px solid transparent; color: var(--muted); background: transparent; text-decoration: underline; text-underline-offset: 5px; cursor: pointer; }
    .back[hidden] { display: none; }

    .loading { padding-top: 25vh; text-align: center; }
    .spinner { width: 70px; height: 70px; margin: 0 auto 24px; border: 4px solid color-mix(in srgb, var(--accent) 22%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .85s linear infinite; }
    .loading p { color: var(--muted); letter-spacing: .08em; }
    .result-kicker { margin: 0; color: var(--accent); font-size: .85rem; letter-spacing: .16em; }
    .result-title { margin: 9px 0 12px; color: var(--accent); font-size: clamp(2rem, 9vw, 3.5rem); }
    .result-summary { margin: 0 0 22px; font-size: 1.06rem; }
    .result .card { margin-top: 16px; margin-bottom: 20px; }
    .result .card h3 { margin-bottom: 7px; color: var(--accent); font-size: 1.05rem; }
    .result .card p { color: var(--text); }
    .cta { margin: 28px 5px; padding: 23px; border: 1px solid var(--accent); border-radius: 18px; background: linear-gradient(135deg, var(--primary), var(--card)); box-shadow: 7px 7px 0 var(--shadow); }
    .cta h3 { color: var(--accent); font-size: 1.35rem; }
    .cta p { margin: 7px 0 18px; }
    .cta-link { width: 100%; margin: 0; color: var(--background); background: var(--accent); }
    .cta-link[aria-disabled="true"] { color: var(--muted); background: var(--card); cursor: default; opacity: .78; }
    .restart { border-color: color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; text-decoration: none; }
    .disclaimer { margin: 25px auto 0; color: var(--muted); text-align: center; font-size: .8rem; }

    @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { from { transform: translate3d(-2vw, -1vh, 0) scale(.94); border-radius: 43% 57% 61% 39%; } to { transform: translate3d(5vw, 6vh, 0) scale(1.08); border-radius: 62% 38% 42% 58%; } }

    @media (min-width: 681px) {
      body { padding: 28px 0; }
      .page { min-height: calc(100vh - 56px); border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); border-radius: 28px; box-shadow: 0 22px 70px rgba(0, 0, 0, .38); }
    }

    @media (max-width: 380px) {
      .page { padding-right: 14px; padding-left: 14px; }
      h1 { font-size: 2rem; }
      .option { padding: 14px 12px; }
      .card, .cta { margin-right: 5px; margin-left: 3px; padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

    let currentQuestion = 0;

    function applyTheme() {
      const root = document.documentElement;
      root.style.setProperty("--background", THEME_CONFIG.backgroundColor);
      root.style.setProperty("--primary", THEME_CONFIG.primaryColor);
      root.style.setProperty("--accent", THEME_CONFIG.accentColor);
      root.style.setProperty("--text", THEME_CONFIG.textColor);
      root.style.setProperty("--card", THEME_CONFIG.cardColor);
      root.style.setProperty("--font", THEME_CONFIG.fontStyle);
      document.body.dataset.visualStyle = THEME_CONFIG.visualStyle;
    }

    function renderSite() {
      document.title = SITE_CONFIG.pageTitle;
      document.querySelector('meta[name="description"]').content = SITE_CONFIG.description;
      element["category-label"].textContent = SITE_CONFIG.categoryLabel;
      element["hero-title"].textContent = SITE_CONFIG.heroTitle;
      element["hero-subtitle"].textContent = SITE_CONFIG.heroSubtitle;
      element["hero-supporting"].textContent = UI_TEXT.heroSupporting;
      element["intro-title"].textContent = SITE_CONFIG.introTitle;
      element["intro-text"].textContent = SITE_CONFIG.introText;
      element["start-button"].textContent = SITE_CONFIG.startButtonText;
      element.duration.textContent = UI_TEXT.heroSupporting;
      element["quiz-label"].textContent = UI_TEXT.quizLabel;
      element["back-button"].textContent = UI_TEXT.previous;
      element["loading-text"].textContent = UI_TEXT.calculating;
      element["result-kicker"].textContent = UI_TEXT.resultKicker;
      element["analysis-label"].textContent = UI_TEXT.analysisLabel;
      element["detail-label"].textContent = UI_TEXT.detailLabel;
      element["action-label"].textContent = UI_TEXT.actionLabel;
      element["cta-title"].textContent = SITE_CONFIG.ctaTitle;
      element["cta-description"].textContent = SITE_CONFIG.ctaDescription;
      element["restart-button"].textContent = UI_TEXT.restart;
      element.disclaimer.textContent = SITE_CONFIG.disclaimer;
      renderCta();
    }

    function renderCta() {
      const url = SITE_CONFIG.ctaUrl.trim();
      if (!url) {
        element["cta-button"].textContent = UI_TEXT.unsetCta;
        element["cta-button"].removeAttribute("href");
        element["cta-button"].setAttribute("aria-disabled", "true");
        element["cta-button"].setAttribute("role", "button");
        return;
      }
      element["cta-button"].textContent = SITE_CONFIG.ctaButtonText;
      element["cta-button"].href = url;
      element["cta-button"].removeAttribute("aria-disabled");
      element["cta-button"].removeAttribute("role");
    }

    function showScreen(screen) {
      [element.cover, element["quiz-screen"], element["loading-screen"], element["result-screen"]]
        .forEach(item => { item.hidden = item !== screen; });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const question = QUESTIONS[currentQuestion];
      element["question-count"].textContent = `${currentQuestion + 1} / ${QUESTIONS.length}`;
      element.progress.setAttribute("aria-valuenow", String(currentQuestion + 1));
      element["progress-fill"].style.width = `${((currentQuestion + 1) / QUESTIONS.length) * 100}%`;
      element["question-number"].textContent = question.label;
      element["question-title"].textContent = question.title;
      element["question-hint"].textContent = question.hint;
      element.options.replaceChildren(...Object.entries(question.options).map(([letter, text]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `option${answers[currentQuestion] === letter ? " selected" : ""}`;
        button.setAttribute("aria-pressed", String(answers[currentQuestion] === letter));
        const badge = document.createElement("span");
        badge.className = "option-letter";
        badge.textContent = letter;
        const copy = document.createElement("span");
        copy.textContent = text;
        button.append(badge, copy);
        button.addEventListener("click", () => selectAnswer(letter));
        return button;
      }));
      element["next-button"].textContent = currentQuestion === QUESTIONS.length - 1 ? UI_TEXT.viewResult : UI_TEXT.next;
      element["next-button"].disabled = answers[currentQuestion] === null;
      element["back-button"].hidden = currentQuestion === 0;
    }

    function selectAnswer(letter) {
      answers[currentQuestion] = letter;
      renderQuestion();
    }

    function renderResult() {
      const result = RESULTS[answers[0]];
      element["result-title"].textContent = result.title;
      element["result-summary"].textContent = result.summary;
      element["result-analysis"].textContent = result.analysis;
      element["result-detail"].textContent = DETAILS[answers[1]];
      element["result-action"].textContent = ACTIONS[answers[2]];
      showScreen(element["result-screen"]);
    }

    function nextQuestion() {
      if (answers[currentQuestion] === null) return;
      if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion += 1;
        renderQuestion();
        showScreen(element["quiz-screen"]);
        return;
      }
      showScreen(element["loading-screen"]);
      window.setTimeout(renderResult, 1000);
    }

    function previousQuestion() {
      if (currentQuestion === 0) return;
      currentQuestion -= 1;
      renderQuestion();
      showScreen(element["quiz-screen"]);
    }

    function restartQuiz() {
      answers.fill(null);
      currentQuestion = 0;
      renderQuestion();
      showScreen(element.cover);
    }

    element["start-button"].addEventListener("click", () => {
      currentQuestion = 0;
      renderQuestion();
      showScreen(element["quiz-screen"]);
    });
    element["next-button"].addEventListener("click", nextQuestion);
    element["back-button"].addEventListener("click", previousQuestion);
    element["restart-button"].addEventListener("click", restartQuiz);
    element["cta-button"].addEventListener("click", event => {
      if (!SITE_CONFIG.ctaUrl.trim()) event.preventDefault();
    });

    applyTheme();
    renderSite();
    renderQuestion();
  </script>
</body>
</html>
